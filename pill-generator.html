<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:#f3f1f8;color:#222;min-height:100vh;}

.field-group label{display:block;font-size:13px;font-weight:700;color:#444;margin-bottom:6px;}
.field-group input[type="text"],

.field-group input[type="file"]{width:100%;font-size:13px;padding:8px 0;}

.section-divider{border:none;border-top:1px dashed #e4e1ec;margin:20px 0;}
.actions{display:flex;flex-direction:column;gap:10px;margin-top:22px;}

</div>

<script>
// ---- persistent image state (base64 data URLs) ----
let profileImageData = '';
let bannerImageData = '';

// ---- helpers ----
function escapeHtml(str){
  return String(str || '').replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}
function toWesternDigits(str){
  var map={'٠':'0','١':'1','٢':'2','٣':'3','٤':'4','٥':'5','٦':'6','٧':'7','٨':'8','٩':'9','۰':'0','۱':'1','۲':'2','۳':'3','۴':'4','۵':'5','۶':'6','۷':'7','۸':'8','۹':'9'};
  return String(str || '').replace(/[٠-٩۰-۹]/g, function(c){ return map[c]; });
}
function digitsOnly(str){
  return String(str || '').replace(/[^0-9]/g, '');
}
function escapeJsStr(str){
  return String(str || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/\n/g, '\\n').replace(/</g, '\\u003c');
}

function getFormData(){
  return {
    businessName: document.getElementById('businessName').value.trim(),
    bannerTitle: document.getElementById('bannerTitle').value.trim(),
    bannerSubtitle: document.getElementById('bannerSubtitle').value.trim(),
    bannerLink: document.getElementById('bannerLink').value.trim(),
    tiktokUsername: document.getElementById('tiktokUsername').value.trim().replace(/^@/, ''),
    tiktokProfileLink: document.getElementById('tiktokProfileLink').value.trim(),
    whatsapp: digitsOnly(document.getElementById('whatsappNumber').value),
    viber: digitsOnly(document.getElementById('viberNumber').value),
    phone: digitsOnly(document.getElementById('phoneNumber').value),
    modalQuestion: document.getElementById('modalQuestion').value.trim(),
    intents: [1,2,3].map(function(i){
      return {
        emoji: document.getElementById('intent'+i+'Emoji').value.trim(),
        label: document.getElementById('intent'+i+'Label').value.trim(),
        msg: document.getElementById('intent'+i+'Msg').value.trim()
      };
    })
  };
}

// ---- builds the full standalone generated-page.html, reusing the reference design 1:1 ----
function buildGeneratedHTML(data){
  var rawName = toWesternDigits(data.businessName) || 'ناوی بزنس';
  var businessName = escapeHtml(rawName);
  var initial = escapeHtml(rawName.trim().charAt(0) || '?');

  var bannerTitle = escapeHtml(toWesternDigits(data.bannerTitle) || 'تایتڵی ڤیدیۆکە لێرە');
  var bannerSubtitle = escapeHtml(toWesternDigits(data.bannerSubtitle) || 'ناونیشانی کورت لەسەر ڤیدیۆکە لێرە دەنووسرێت');

  var tiktokUsername = escapeHtml(data.tiktokUsername || 'username');
  var tiktokProfileLink = data.tiktokProfileLink || (data.tiktokUsername ? 'https://www.tiktok.com/@' + data.tiktokUsername : 'https://www.tiktok.com/');
  var bannerLink = data.bannerLink || tiktokProfileLink;
  var bannerImg = bannerImageData || 'https://placehold.co/234x312/111111/ffffff?text=TikTok';

  var avatarInner = profileImageData
    ? '<img src="' + profileImageData + '" alt="' + businessName + '" style="width:100%;height:100%;object-fit:cover;display:block;">'
    : initial;

  var whatsapp = data.whatsapp || '';
  var viber = data.viber || '';
  var phone = data.phone || '';

  var modalQuestion = escapeJsStr(data.modalQuestion || 'چۆن هاوکارت بین؟');

  var defaultIntents = [
    {emoji:'🏷️',label:'داواکردنی نرخ',msg:'سڵاو، دەمەوێت نرخەکان بزانم 🙏'},
    {emoji:'❓',label:'پرسیارم هەیە',msg:'سڵاو، پرسیارێکم هەیە دەربارەی بەرهەم/خزمەتگوزارییەکەتان'},
    {emoji:'📦',label:'دەمەوێت داواکارییەک بکەم',msg:'سڵاو، دەمەوێت داواکارییەک بکەم'}
  ];
  var intents = defaultIntents.map(function(d, i){
    var it = (data.intents && data.intents[i]) || {};
    return {
      emoji: it.emoji || d.emoji,
      label: it.label || d.label,
      msg: it.msg || d.msg
    };
  });
  var intentsJSON = JSON.stringify(intents).replace(/</g, '\\u003c');

  return `<!DOCTYPE html><html dir="rtl" lang="ku"><head>

.no-sh::after{animation:none!important;display:none;}
</style></head><body>

</div></div>

<div class="btns"><a id="wa" class="pl-btn shine-active" style="background:linear-gradient(to left,#128c7e,#25d366);box-shadow:0 6px 20px rgba(37,211,102,.42);"><span style="width:44px;flex-shrink:0;"></span><span class="pl-lbl">واتسئاپ</span><i class="fab fa-whatsapp" style="font-size:25px;width:44px;flex-shrink:0;text-align:center;"></i></a><a id="vb" class="pl-btn" style="background:linear-gradient(to left,#5c4fd6,#7360f2);box-shadow:0 6px 20px rgba(115,96,242,.42);"><span style="width:44px;flex-shrink:0;"></span><span class="pl-lbl">ڤایبەر</span><i class="fab fa-viber" style="font-size:22px;width:44px;flex-shrink:0;text-align:center;"></i></a><a id="ph" class="pl-btn" style="background:linear-gradient(to left,#1d4ed8,#2563eb);box-shadow:0 6px 20px rgba(37,99,235,.42);"><span style="width:44px;flex-shrink:0;"></span><span class="pl-lbl">کۆرەک</span><i class="fas fa-phone-alt" style="font-size:20px;width:44px;flex-shrink:0;text-align:center;"></i></a></div>

</div>
<script>
const INTENTS=${intentsJSON};
let _app='',_url='',_videoLink='';
(function(){
  var params=new URLSearchParams(location.search);
  var vid=params.get('vid'),user=params.get('user');
  if(!vid||!user)return;
  _videoLink='https://www.tiktok.com/@'+user+'/video/'+vid;
  var a=document.querySelector('.vbanner');
  if(a)a.href=_videoLink;
  fetch('https://www.tiktok.com/oembed?url='+encodeURIComponent(_videoLink))
    .then(function(r){return r.json();})
    .then(function(d){
      if(d.thumbnail_url){var img=document.querySelector('.vbanner-thumb img');if(img)img.src=d.thumbnail_url;}
    })
    .catch(function(){});
})();
function openModal(){var box=document.getElementById('modBox');box.classList.remove('loaded');document.getElementById('mod').classList.add('active');if(navigator.vibrate)navigator.vibrate(22);setTimeout(function(){box.classList.add('loaded');},550);}
function askIntent(n,u){_app=n;document.getElementById('mod-ttl').innerText='${modalQuestion}';document.getElementById('mod-desc').style.display='block';document.getElementById('mod-ok').style.display='none';var wrap=document.getElementById('mod-options');wrap.innerHTML='';wrap.style.display='flex';INTENTS.forEach(function(it){var b=document.createElement('button');b.className='intent-btn';b.innerHTML='<span class="intent-ico">'+it.emoji+'</span><span class="intent-lbl">'+it.label+'</span><i class="fas fa-chevron-left intent-chev"></i>';b.onclick=function(){selectIntent(u,it.msg);};wrap.appendChild(b);});openModal();}
function selectIntent(u,msg){if(_videoLink)msg='🎬 '+_videoLink+'\\n\\n'+msg;if(u.indexOf('tel:')===0){_url=u;goLink();return;}var sep=u.indexOf('?')>-1?'&':'?';_url=u+sep+'text='+encodeURIComponent(msg);goLink();}
function closeMod(){document.getElementById('mod').classList.remove('active');}
function goLink(){const lt=localStorage.getItem('tt_ct');const ct=Date.now();if(window.ttq&&(!lt||ct-lt>86400000)){ttq.track('Contact',{content_id:'contact_button',content_name:_app});localStorage.setItem('tt_ct',ct);}closeMod();setTimeout(()=>{window.location.href=_url;},700);}
!function(w,d,t){w.TiktokAnalyticsObject=t;var ttq=w[t]=w[t]||[];ttq.methods=['page','track','identify','instances','debug','on','off','once','ready','alias','group','enableCookie','disableCookie','holdConsent','revokeConsent','grantConsent'];ttq.setAndDefer=function(t,e){t[e]=function(){t.push([e].concat(Array.prototype.slice.call(arguments,0)));};};for(var i=0;i<ttq.methods.length;i++)ttq.setAndDefer(ttq,ttq.methods[i]);ttq.instance=function(t){for(var e=ttq._i[t]||[],n=0;n<ttq.methods.length;n++)ttq.setAndDefer(e,ttq.methods[n]);return e;};ttq.load=function(e,n){var r='https://analytics.tiktok.com/i18n/pixel/events.js';ttq._i=ttq._i||{};ttq._i[e]=[];ttq._i[e]._u=r;ttq._t=ttq._t||{};ttq._t[e]=+new Date;ttq._o=ttq._o||{};ttq._o[e]=n||{};var s=document.createElement('script');s.type='text/javascript';s.async=!0;s.src=r+'?sdkid='+e+'&lib='+t;var x=document.getElementsByTagName('script')[0];x.parentNode.insertBefore(s,x);};ttq.load('D6BIIA3C77U1CE9DCUMG');ttq.page();}(window,document,'ttq');
function spawnRipple(e){
  var btn=e.currentTarget;
  var rect=btn.getBoundingClientRect();
  var size=Math.max(rect.width,rect.height)*1.6;
  var pt=e.changedTouches?e.changedTouches[0]:e;
  var x=pt.clientX-rect.left-size/2;
  var y=pt.clientY-rect.top-size/2;
  var r=document.createElement('span');
  r.className='ripple';
  r.style.width=r.style.height=size+'px';
  r.style.left=x+'px';
  r.style.top=y+'px';
  btn.appendChild(r);
  r.addEventListener('animationend',function(){r.remove();});
}
document.addEventListener('DOMContentLoaded',function(){
  document.querySelectorAll('.pl-btn').forEach(function(btn){
    btn.addEventListener('click',spawnRipple);
    btn.addEventListener('pointerdown',function(){btn.classList.add('pressed');});
    ['pointerup','pointerleave','pointercancel'].forEach(function(ev){
      btn.addEventListener(ev,function(){btn.classList.remove('pressed');});
    });
  });
  document.getElementById('wa').onclick = function(){
    askIntent('whatsapp', 'whatsapp://send?phone=${whatsapp}');
  };
  document.getElementById('vb').onclick = function(){
    askIntent('viber', 'viber://chat?number=${viber}');
  };
  document.getElementById('ph').onclick = function(){
    askIntent('phone', 'tel:${phone}');
  };
  window.onclick=function(e){if(e.target.id==='mod')closeMod();};
  setTimeout(function(){var s=document.querySelector('.shine-active');if(s)s.classList.add('no-sh');},10000);
});
<\/script></body></html>`;
}

// ---- live preview ----
let previewTimer = null;
function schedulePreviewUpdate(){
  clearTimeout(previewTimer);
  previewTimer = setTimeout(updatePreview, 150);
}
function updatePreview(){
  var data = getFormData();
  var html = buildGeneratedHTML(data);
  document.getElementById('previewFrame').srcdoc = html;
}

// ---- image uploads -> base64 ----
function handleImageUpload(inputEl, onLoaded){
  var file = inputEl.files && inputEl.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(e){
    onLoaded(e.target.result);
    schedulePreviewUpdate();
  };
  reader.readAsDataURL(file);
}

document.getElementById('profileImageInput').addEventListener('change', function(){
  handleImageUpload(this, function(dataUrl){
    profileImageData = dataUrl;
    var p = document.getElementById('profileImagePreview');
    p.src = dataUrl;
    p.style.display = 'block';
  });
});

document.getElementById('bannerImageInput').addEventListener('change', function(){
  handleImageUpload(this, function(dataUrl){
    bannerImageData = dataUrl;
    var p = document.getElementById('bannerImagePreview');
    p.src = dataUrl;
    p.style.display = 'block';
  });
});

// ---- wire up all text inputs for live preview ----
document.querySelectorAll('.form-panel input[type="text"], .form-panel input[type="url"], .form-panel input[type="tel"]').forEach(function(el){
  el.addEventListener('input', schedulePreviewUpdate);
});

// ---- preview button (manual refresh) ----
document.getElementById('previewBtn').addEventListener('click', updatePreview);

// ---- generate & download the standalone generated-page.html ----
document.getElementById('downloadBtn').addEventListener('click', function(){
  var data = getFormData();
  var html = buildGeneratedHTML(data);
  var blob = new Blob([html], {type:'text/html'});
  var url = URL.createObjectURL(blob);
  var slugSource = data.businessName || 'generated-page';
  var slug = slugSource.replace(/[^a-zA-Z0-9\u0600-\u06FF\-]+/g, '-').replace(/^-+|-+$/g, '') || 'generated-page';
  var a = document.createElement('a');
  a.href = url;
  a.download = slug + '.html';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

// ---- initial preview render ----
updatePreview();
</script>

</body>
</html>
