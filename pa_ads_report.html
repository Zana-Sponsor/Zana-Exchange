<!DOCTYPE html>
<html lang="ku" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ڕاپۆرتی ڕیکلامەکان</title>
<style>
:root{
  --bg:#f0f4f9;
  --surface:#fff;
  --card:#fff;
  --border:#dde4ee;
  --border2:#e8edf5;
  --accent:#2563eb;
  --accent-h:#1d4ed8;
  --cyan:#0891b2;
  --text:#1e293b;
  --muted:#64748b;
  --muted2:#94a3b8;
  --green:#16a34a;
  --green-bg:#f0fdf4;
  --amber:#d97706;
  --red:#dc2626;
  --red-bg:#fef2f2;
  --purple:#7c3aed;
  --shadow:0 1px 4px rgba(0,0,0,.08),0 4px 16px rgba(0,0,0,.05);
  --shadow-lg:0 8px 32px rgba(0,0,0,.12);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100vh;direction:rtl}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#c8d4e8;border-radius:3px}

/* ═══ HEADER ═══ */
.hdr{
  background:#fff;border-bottom:1px solid var(--border);
  padding:16px 28px;position:sticky;top:0;z-index:200;
  box-shadow:0 1px 8px rgba(0,0,0,.06);
}
.hdr-top{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px}
.brand{display:flex;align-items:center;gap:11px}
.brand-ico{
  width:38px;height:38px;border-radius:10px;flex-shrink:0;
  background:linear-gradient(135deg,var(--accent),var(--cyan));
  display:flex;align-items:center;justify-content:center;font-size:17px;
  box-shadow:0 2px 8px rgba(37,99,235,.3);
}
.brand-txt h1{font-size:1.1rem;font-weight:800;color:var(--text);letter-spacing:-.02em;line-height:1.2}
.brand-txt h1 em{font-style:normal;color:var(--accent)}
.brand-txt p{font-size:.68rem;color:var(--muted);margin-top:1px}

.hdr-right{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.refresh-info{font-size:.7rem;color:var(--muted);text-align:left}
.refresh-info span{color:var(--accent);font-weight:700}

.btn{
  display:inline-flex;align-items:center;gap:5px;
  padding:7px 13px;border-radius:8px;border:none;cursor:pointer;
  font-size:.78rem;font-weight:700;transition:all .15s;white-space:nowrap;font-family:inherit;
}
.btn-primary{background:var(--accent);color:#fff;box-shadow:0 2px 6px rgba(37,99,235,.3)}
.btn-primary:hover{background:var(--accent-h);transform:translateY(-1px)}
.btn-primary:disabled{background:#93c5fd;cursor:not-allowed;transform:none;box-shadow:none}
.btn-sm{padding:5px 11px;font-size:.72rem}
.btn-ghost{background:transparent;border:1px solid var(--border);color:var(--muted)}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent);background:#eff6ff}
.btn-danger{background:var(--red-bg);border:1px solid #fecaca;color:var(--red)}
.btn-danger:hover{background:#fee2e2}
.btn-success{background:var(--green-bg);border:1px solid #bbf7d0;color:var(--green)}
.btn-success:hover{background:#dcfce7}
.btn-warn{background:#fffbeb;border:1px solid #fde68a;color:var(--amber)}
.btn-warn:hover{background:#fef3c7}

/* stats */
.stats{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.chip{
  background:var(--bg);border:1px solid var(--border);
  border-radius:10px;padding:7px 14px;display:flex;flex-direction:column;
  align-items:center;min-width:70px;transition:border-color .15s,box-shadow .15s;
}
.chip:hover{border-color:var(--accent);box-shadow:0 2px 8px rgba(37,99,235,.1)}
.chip .cv{font-size:1.05rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.chip .cl{font-size:.62rem;color:var(--muted);margin-top:3px}
.c-all{color:var(--accent)}.c-act{color:var(--green)}.c-done{color:var(--cyan)}
.c-sched{color:var(--purple)}.c-rej{color:var(--red)}.c-pause{color:var(--amber)}
.c-pend{color:#4338ca}.c-rev{color:#1d4ed8}
.c-spend{color:#0f766e}

/* ═══ FILTER BAR ═══ */
.fbar{
  background:#fff;border-bottom:1px solid var(--border);
  padding:10px 28px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;
}
.fbar select,.fbar input{
  background:var(--bg);border:1px solid var(--border);border-radius:8px;
  color:var(--text);padding:6px 11px;font-size:.78rem;outline:none;
  transition:border-color .15s;font-family:inherit;
}
.fbar select:focus,.fbar input:focus{border-color:var(--accent);background:#fff}
.fbar input{min-width:200px;flex:1}
.fbar label{font-size:.72rem;color:var(--muted)}

/* status bar */
#sb{
  padding:7px 28px;font-size:.78rem;color:var(--muted);
  display:flex;align-items:center;gap:7px;min-height:32px;
  background:var(--bg);
}
#sb.err{color:var(--red)}
#sb.ok{color:var(--green)}
.dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.dot-ok{background:var(--green)}.dot-spin{background:var(--accent);animation:pulse 1s ease-in-out infinite}.dot-err{background:var(--red)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

/* ═══ GRID ═══ */
#grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(400px,1fr));
  gap:16px;padding:16px 28px 60px;
}

/* ═══ CARD ═══ */
.card{
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  overflow:hidden;transition:transform .15s,box-shadow .15s;
  display:flex;flex-direction:column;
  box-shadow:var(--shadow);
}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:#bfdbfe}

/* card header */
.ch{
  background:linear-gradient(135deg,#eff6ff 0%,#f8faff 100%);
  padding:14px 16px 12px;
  display:flex;align-items:flex-start;justify-content:space-between;gap:10px;
  border-bottom:1px solid var(--border2);
}
.ch-l{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.ad-num{font-size:.66rem;color:var(--muted2);font-family:monospace;letter-spacing:.03em}
.ad-name{font-size:.95rem;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ad-uuid{font-size:.58rem;color:var(--muted2);font-family:monospace;margin-top:2px}

.pill{padding:3px 10px;border-radius:20px;font-size:.62rem;font-weight:800;letter-spacing:.06em;white-space:nowrap;flex-shrink:0;text-transform:uppercase}
.p-active   {background:#dcfce7;color:#15803d;border:1px solid #86efac}
.p-completed{background:#dbeafe;color:#1d4ed8;border:1px solid #93c5fd}
.p-scheduled{background:#ede9fe;color:#6d28d9;border:1px solid #c4b5fd}
.p-rejected {background:#fee2e2;color:#b91c1c;border:1px solid #fca5a5}
.p-paused   {background:#fef3c7;color:#b45309;border:1px solid #fde68a}
.p-pending  {background:#e0e7ff;color:#4338ca;border:1px solid #c7d2fe}
.p-review   {background:#dbeafe;color:#1d4ed8;border:1px solid #93c5fd}
.p-default  {background:#f1f5f9;color:#64748b;border:1px solid #cbd5e1}

/* card body */
.cb{padding:12px 16px 16px;display:flex;flex-direction:column;gap:0;flex:1}

/* metrics */
.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
.metric{
  background:var(--bg);border:1px solid var(--border2);border-radius:9px;
  padding:9px 6px 7px;text-align:center;transition:border-color .15s;
}
.metric:hover{border-color:#bfdbfe}
.metric .ml{font-size:.58rem;color:var(--muted2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px}
.metric .mv{font-size:1rem;font-weight:800;color:var(--text)}

/* budget bar */
.bbar{margin:2px 0 12px}
.bbar-labels{display:flex;justify-content:space-between;font-size:.65rem;margin-bottom:3px;color:var(--muted)}
.bbar-labels span:last-child{color:var(--accent);font-weight:700}
.bbar-track{height:5px;background:var(--border2);border-radius:3px;overflow:hidden}
.bbar-fill{height:100%;border-radius:3px;background:linear-gradient(90deg,var(--accent),var(--cyan));transition:width .6s}

/* section title */
.st{
  font-size:.6rem;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);
  font-weight:800;margin:10px 0 6px;padding-bottom:5px;
  border-bottom:1px solid var(--border2);
  display:flex;align-items:center;gap:5px;
}
.st::before{content:'';display:inline-block;width:3px;height:9px;border-radius:2px;background:var(--accent);flex-shrink:0}

/* field row */
.fr{display:flex;justify-content:space-between;align-items:flex-start;padding:3px 0;gap:8px;border-bottom:1px solid var(--border2)}
.fr:last-child{border-bottom:none}
.fl{font-size:.7rem;color:var(--muted);min-width:100px;flex-shrink:0;padding-top:1px;line-height:1.4}
.fv{font-size:.75rem;color:var(--text);text-align:left;direction:ltr;word-break:break-all;flex:1;line-height:1.4}
.fv.null{color:var(--muted2);font-style:italic}
.fv.hi  {color:var(--accent);font-weight:700}
.fv.grn {color:var(--green);font-weight:600}
.fv.red {color:var(--red)}
.fv.mono{font-family:monospace;font-size:.67rem;color:var(--muted)}
a.vlink{color:var(--accent);text-decoration:none;font-size:.7rem;direction:ltr}
a.vlink:hover{text-decoration:underline}

.rbox{background:var(--red-bg);border:1px solid #fecaca;border-radius:7px;padding:8px 12px;margin-top:9px;font-size:.75rem;color:var(--red);line-height:1.5}

/* card actions */
.card-actions{
  display:flex;gap:7px;padding:10px 16px 12px;
  border-top:1px solid var(--border2);background:var(--bg);
  flex-wrap:wrap;
}

/* ═══ MODAL ═══ */
.modal-overlay{
  position:fixed;inset:0;background:rgba(15,23,42,.45);
  display:flex;align-items:center;justify-content:center;
  z-index:1000;padding:16px;
  backdrop-filter:blur(4px);
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal{
  background:#fff;border:1px solid var(--border);border-radius:16px;
  width:100%;max-width:600px;max-height:92vh;
  display:flex;flex-direction:column;
  box-shadow:var(--shadow-lg);
  transform:translateY(18px);transition:transform .2s;
}
.modal-overlay.open .modal{transform:translateY(0)}
.modal-hdr{
  padding:18px 22px 14px;display:flex;align-items:center;justify-content:space-between;
  border-bottom:1px solid var(--border);background:#f8faff;border-radius:16px 16px 0 0;
}
.modal-hdr h2{font-size:.95rem;font-weight:800;color:var(--text)}
.modal-body{padding:18px 22px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:12px}
.modal-footer{padding:12px 22px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;background:#f8faff;border-radius:0 0 16px 16px}

/* form */
.fg{display:flex;flex-direction:column;gap:4px}
.fg label{font-size:.72rem;color:var(--muted);font-weight:700}
.fg input,.fg select,.fg textarea{
  background:var(--bg);border:1px solid var(--border);border-radius:7px;
  color:var(--text);padding:8px 11px;font-size:.82rem;outline:none;
  transition:border-color .15s,background .15s;font-family:inherit;
}
.fg input:focus,.fg select:focus,.fg textarea:focus{border-color:var(--accent);background:#fff}
.fg textarea{resize:vertical;min-height:60px}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.frow-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.sec-sep{
  font-size:.62rem;text-transform:uppercase;letter-spacing:.12em;color:var(--accent);
  font-weight:800;padding-bottom:5px;border-bottom:2px solid #dbeafe;margin-top:4px;
}

/* spinner */
.spin-wrap{display:flex;justify-content:center;padding:80px;grid-column:1/-1}
.spin{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:rot .7s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.empty{text-align:center;padding:80px 40px;color:var(--muted2);grid-column:1/-1}
.empty .ei{font-size:3rem;margin-bottom:12px;opacity:.5}

/* toast */
.toast{
  position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(80px);
  background:#1e293b;color:#f8fafc;
  border-radius:9px;padding:10px 18px;font-size:.82rem;
  box-shadow:0 8px 28px rgba(0,0,0,.25);z-index:2000;
  transition:transform .22s ease;white-space:nowrap;
}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.t-ok{background:#15803d}
.toast.t-err{background:#b91c1c}

@media(max-width:560px){
  #grid{grid-template-columns:1fr;padding:10px 10px 50px}
  .hdr,.fbar,#sb{padding-left:12px;padding-right:12px}
  .frow,.frow-3{grid-template-columns:1fr}
  .stats{gap:5px}
  .chip{min-width:56px;padding:6px 9px}
}
</style>
</head>
<body>

<header class="hdr">
  <div class="hdr-top">
    <div class="brand">
      <div class="brand-ico">📊</div>
      <div class="brand-txt">
        <h1>ڕاپۆرتی <em>ڕیکلامەکان</em></h1>
        <p>pa_ads — Supabase</p>
      </div>
    </div>
    <div class="hdr-right">
      <div class="refresh-info">
        ئۆتۆماتیک هەر <span id="ri-sec">30s</span><br>
        کۆتا: <span id="ri-time">—</span>
      </div>
      <button class="btn btn-primary btn-sm" onclick="manualRefresh()">🔄 نوێکردنەوە</button>
    </div>
  </div>
  <div class="stats">
    <div class="chip"><span class="cv c-all"  id="s-total">—</span><span class="cl">کۆی گشتی</span></div>
    <div class="chip"><span class="cv c-act"  id="s-active">—</span><span class="cl">چالاک</span></div>
    <div class="chip"><span class="cv c-pend" id="s-pending">—</span><span class="cl">چاوەڕوان</span></div>
    <div class="chip"><span class="cv c-rev"  id="s-review">—</span><span class="cl">پێداچوونەوە</span></div>
    <div class="chip"><span class="cv c-done" id="s-done">—</span><span class="cl">تەواو</span></div>
    <div class="chip"><span class="cv c-sched" id="s-sched">—</span><span class="cl">پلانگیراو</span></div>
    <div class="chip"><span class="cv c-rej"  id="s-rej">—</span><span class="cl">ڕەتکراو</span></div>
    <div class="chip"><span class="cv c-pause" id="s-pause">—</span><span class="cl">وەستاو</span></div>
    <div class="chip"><span class="cv c-spend" id="s-spend">—</span><span class="cl">$ خەرجکراو</span></div>
  </div>
</header>

<div class="fbar">
  <label>فلتەر:</label>
  <select id="f-status" onchange="render()">
    <option value="">هەموو حالەتەکان</option>
    <option value="pending">چاوەڕوان</option>
    <option value="review">پێداچوونەوە</option>
    <option value="active">چالاک</option>
    <option value="completed">تەواوبوو</option>
    <option value="scheduled">پلانگیراو</option>
    <option value="rejected">ڕەتکراوە</option>
    <option value="paused">وەستاو</option>
  </select>
  <select id="f-goal" onchange="render()">
    <option value="">هەموو ئامانجەکان</option>
    <option value="messages">Messages</option>
    <option value="views">Views</option>
  </select>
  <select id="f-gender" onchange="render()">
    <option value="">هەموو ژینگەکان</option>
    <option value="male">نێر</option>
    <option value="female">مێ</option>
    <option value="all">هەموو</option>
  </select>
  <input type="text" id="f-search" placeholder="گەڕان — ناو، ژمارە، ID...ئامانج" oninput="render()"/>
</div>

<div id="sb"><span class="dot dot-spin" id="sb-dot"></span><span id="sb-msg">بارکردن...</span></div>
<div id="grid"></div>

<!-- MODAL -->
<div class="modal-overlay" id="modal" onclick="maybeClose(event)">
  <div class="modal">
    <div class="modal-hdr">
      <h2 id="modal-title">دەستکاریکردنی ڕیکلام</h2>
      <button class="btn btn-ghost btn-sm" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">هەڵوەشاندنەوە</button>
      <button class="btn btn-primary" id="save-btn" onclick="saveEdit()">💾 پاشەکەوتکردن</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══════════════════════════════════════════
//  ⚙️  CONFIGURATION
//  URL و KEY ی خۆت لێرە بنووسە
// ══════════════════════════════════════════
const SUPABASE_URL = 'https://cojchkwssmasiejcgvbk.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNvamNoa3dzc21hc2llamNndmJrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzczMTE1MTIsImV4cCI6MjA5Mjg4NzUxMn0.RCALy3wpKHGAkmXWcBqEb_QFEUmh6ErdRbfrBmagvtw';
const AUTO_REFRESH_SEC = 30;
// ══════════════════════════════════════════

let ADS=[], editingId=null, refreshTimer=null, countdown=AUTO_REFRESH_SEC;

const H = { headers:{ 'apikey':SUPABASE_KEY,'Authorization':`Bearer ${SUPABASE_KEY}`,'Accept':'application/json' }};

async function load(silent=false){
  if(!silent) setStatus('داتا دەهێنرێت...','spin');
  try{
    let rows=[],from=0,PAGE=1000;
    while(true){
      const r=await fetch(`${SUPABASE_URL}/rest/v1/pa_ads?select=*&order=created_at.desc&offset=${from}&limit=${PAGE}`,H);
      if(!r.ok){const t=await r.text();throw new Error(r.status+': '+t);}
      const chunk=await r.json();
      rows=rows.concat(chunk);
      if(chunk.length<PAGE)break;
      from+=PAGE;
    }
    ADS=rows;
    updateStats();render();
    const t=new Date().toLocaleTimeString();
    document.getElementById('ri-time').textContent=t;
    setStatus(`✓ ${ADS.length} ڕیکلام — ${t}`,'ok');
  }catch(e){
    setStatus('هەڵە: '+e.message,'err');
    if(!ADS.length) document.getElementById('grid').innerHTML='<div class="empty"><div class="ei">⚠️</div><p>'+e.message+'</p></div>';
  }
}

function manualRefresh(){clearInterval(refreshTimer);load(false);startCD();}
function startCD(){
  clearInterval(refreshTimer);countdown=AUTO_REFRESH_SEC;updCD();
  refreshTimer=setInterval(()=>{countdown--;updCD();if(countdown<=0){countdown=AUTO_REFRESH_SEC;load(true);}},1000);
}
function updCD(){const el=document.getElementById('ri-sec');if(el)el.textContent=countdown+'s';}
function setStatus(msg,type){
  document.getElementById('sb-msg').textContent=msg;
  document.getElementById('sb-dot').className='dot '+(type==='spin'?'dot-spin':type==='ok'?'dot-ok':'dot-err');
  document.getElementById('sb').className=type==='err'?'err':type==='ok'?'ok':'';
}
function updateStats(){
  const f=(s)=>ADS.filter(a=>a.status===s).length;
  const spend=ADS.reduce((s,a)=>s+(parseFloat(a.prev_spend||0)+parseFloat(a.current_spend||a.spend||0)),0);
  document.getElementById('s-total').textContent=ADS.length;
  document.getElementById('s-active').textContent=f('active');
  document.getElementById('s-pending').textContent=f('pending');
  document.getElementById('s-review').textContent=f('review');
  document.getElementById('s-done').textContent=f('completed');
  document.getElementById('s-sched').textContent=f('scheduled');
  document.getElementById('s-rej').textContent=f('rejected');
  document.getElementById('s-pause').textContent=f('paused');
  document.getElementById('s-spend').textContent='$'+spend.toFixed(1);
}
function render(){
  const st=document.getElementById('f-status').value;
  const gl=document.getElementById('f-goal').value;
  const ge=document.getElementById('f-gender').value;
  const q=document.getElementById('f-search').value.toLowerCase();
  const list=ADS.filter(a=>{
    if(st&&a.status!==st)return false;
    if(gl&&a.goal!==gl)return false;
    if(ge&&a.gender!==ge)return false;
    if(q){const h=[a.title,a.ad_number,a.id,a.tiktok_ad_id,a.goal].filter(Boolean).join(' ').toLowerCase();if(!h.includes(q))return false;}
    return true;
  });
  const g=document.getElementById('grid');g.innerHTML='';
  if(!list.length){g.innerHTML='<div class="empty"><div class="ei">📭</div><p>هیچ ڕیکلامێک نەدۆزرایەوە</p></div>';return;}
  list.forEach(ad=>g.appendChild(buildCard(ad)));
}

const PILL={active:{c:'p-active',l:'چالاک'},completed:{c:'p-completed',l:'تەواوبوو'},scheduled:{c:'p-scheduled',l:'پلانگیراو'},rejected:{c:'p-rejected',l:'ڕەتکراوە'},paused:{c:'p-paused',l:'وەستاو'},pending:{c:'p-pending',l:'چاوەڕوان'},review:{c:'p-review',l:'پێداچوونەوە'}};
const m=(v,d=2)=>v==null?'—':parseFloat(v).toFixed(d);
const dt=(v)=>!v?'—':String(v).replace('T',' ').replace(/\.\d+.*/,'').replace('+00:00','');
const ag=(ad)=>{try{const r=ad.age_groups;if(!r)return ad.target_ages||'—';const p=typeof r==='string'?JSON.parse(r):r;return Array.isArray(p)?p.join(', '):String(p);}catch{return ad.target_ages||'—';}};

function buildCard(ad){
  const el=document.createElement('div');el.className='card';
  const title=ad.title||('ڕیکلام #'+(ad.ad_number||ad.id?.slice(0,8)||'?'));
  const budget=parseFloat(ad.budget||0);
  const spend=parseFloat(ad.prev_spend||0)+parseFloat(ad.current_spend||ad.spend||0);
  const pct=budget>0?Math.min(100,Math.round(spend/budget*100)):0;
  const pd=PILL[ad.status]||{c:'p-default',l:ad.status||'نەزانراو'};

  el.innerHTML=`
  <div class="ch">
    <div class="ch-l">
      <span class="ad-num">ژ. ${ad.ad_number||'—'} · ${ad.tiktok_ad_id||'—'}</span>
      <span class="ad-name" title="${title}">${title}</span>
      <span class="ad-uuid">${ad.id||''}</span>
    </div>
    <span class="pill ${pd.c}">${pd.l}</span>
  </div>
  <div class="cb">
    <div class="metrics">
      <div class="metric"><div class="ml">Impressions</div><div class="mv">${(parseInt(ad.prev_impressions||0)+parseInt(ad.impressions||0)).toLocaleString()}</div></div>
      <div class="metric"><div class="ml">Clicks</div><div class="mv">${(ad.clicks??0).toLocaleString()}</div></div>
      <div class="metric"><div class="ml">Conversions</div><div class="mv">${(ad.conversions??0).toLocaleString()}</div></div>
      <div class="metric"><div class="ml">Spend $</div><div class="mv">${m(parseFloat(ad.prev_spend||0)+parseFloat(ad.spend||0))}</div></div>
      <div class="metric"><div class="ml">CPM $</div><div class="mv">${m(ad.cpm)}</div></div>
      <div class="metric"><div class="ml">Conv %</div><div class="mv">${m(ad.conversion_rate)}</div></div>
    </div>
    <div class="bbar">
      <div class="bbar-labels"><span>خەرجکراو لە بودجە</span><span>${pct}% &nbsp;$${m(spend)} / $${m(budget)}</span></div>
      <div class="bbar-track"><div class="bbar-fill" style="width:${pct}%"></div></div>
    </div>
    <div class="st">زانیاری بنەڕەتی</div>
    <div class="fr"><span class="fl">ئامانج</span><span class="fv hi">${ad.goal||'—'}</span></div>
    <div class="fr"><span class="fl">ژینگە</span><span class="fv">${ad.gender||'—'}</span></div>
    <div class="fr"><span class="fl">شوێن</span><span class="fv">${ad.location||'—'}</span></div>
    <div class="fr"><span class="fl">تەمەن</span><span class="fv">${ag(ad)}</span></div>
    <div class="fr"><span class="fl">Cost/Conv</span><span class="fv">$${m(ad.cost_per_conversion)}</span></div>
    <div class="st">بودجە و کات</div>
    <div class="fr"><span class="fl">بودجە</span><span class="fv grn">$${m(ad.budget)}</span></div>
    <div class="fr"><span class="fl">ئامانجی بودجە</span><span class="fv">$${m(ad.target_budget)}</span></div>
    <div class="fr"><span class="fl">بودجەی ڕۆژانە</span><span class="fv">${ad.daily_budget!=null?'$'+m(ad.daily_budget):'—'}</span></div>
    <div class="fr"><span class="fl">بودجەی گشتی</span><span class="fv">${ad.total_budget!=null?'$'+m(ad.total_budget):'—'}</span></div>
    <div class="fr"><span class="fl">خەرجکراوی ئێستا</span><span class="fv grn">$${m(ad.current_spend)}</span></div>
    <div class="fr"><span class="fl">ڕۆژ</span><span class="fv">${ad.days??'—'} ڕۆژ</span></div>
    <div class="fr"><span class="fl">دەستپێک</span><span class="fv">${ad.start_date||'—'}${ad.start_time?' · '+ad.start_time:''}</span></div>
    <div class="fr"><span class="fl">کۆتایی</span><span class="fv">${ad.end_date||'—'}</span></div>
    <div class="st">TikTok</div>
    <div class="fr"><span class="fl">Ad ID</span><span class="fv mono">${ad.tiktok_ad_id||'—'}</span></div>
    <div class="fr"><span class="fl">Campaign ID</span><span class="fv mono">${ad.tiktok_campaign_id||'—'}</span></div>
    <div class="fr"><span class="fl">Video</span><span class="fv">${ad.video_link?`<a class="vlink" href="${ad.video_link}" target="_blank">🔗 بینینی ڤیدیۆ</a>`:'—'}</span></div>
    <div class="fr"><span class="fl">TikTok URL</span><span class="fv">${ad.tiktok_url?`<a class="vlink" href="${ad.tiktok_url}" target="_blank">🔗 لینک</a>`:'—'}</span></div>
    <div class="st">سیستەم</div>
    <div class="fr"><span class="fl">دروستکرا</span><span class="fv mono">${dt(ad.created_at)}</span></div>
    <div class="fr"><span class="fl">نوێکرایەوە</span><span class="fv mono">${dt(ad.updated_at)}</span></div>
    <div class="fr"><span class="fl">کۆتا هاوکێشان</span><span class="fv mono">${dt(ad.last_sync)}</span></div>
    <div class="fr"><span class="fl">ئاگادارکردنەوە</span><span class="fv ${ad.notified_admin?'grn':''}">${ad.notified_admin?'✓ بەڵێ':'نەخێر'}</span></div>
    ${ad.reject_reason&&ad.reject_reason!=='EMPTY'&&ad.reject_reason!=='NULL'?`<div class="rbox">⚠️ ${ad.reject_reason}</div>`:''}
  </div>
  <div class="card-actions">
    <button class="btn btn-ghost btn-sm" onclick="openEdit('${ad.id}')">✏️ دەستکاری</button>
    <button class="btn ${ad.status==='active'?'btn-warn':'btn-success'} btn-sm" onclick="toggleStatus('${ad.id}','${ad.status}')">
      ${ad.status==='active'?'⏸ وەستاندن':'▶ چالاككردن'}
    </button>
    <button class="btn btn-danger btn-sm" onclick="deleteAd('${ad.id}')">🗑 سڕینەوە</button>
  </div>`;
  return el;
}

// ── EDIT MODAL (هەموو خانەکان) ──
function openEdit(id){
  const ad=ADS.find(a=>a.id===id);
  if(!ad)return;
  editingId=id;
  document.getElementById('modal-title').textContent='✏️ '+(ad.title||'ڕیکلام #'+ad.ad_number);

  // helpers for form fields
  const inp=(id,val,type='text')=>`<div class="fg"><label>${id}</label><input id="e-${id}" type="${type}" value="${val??''}"/></div>`;
  const sel=(id,val,opts)=>`<div class="fg"><label>${id}</label><select id="e-${id}">${opts.map(o=>`<option value="${o.v}"${val===o.v?' selected':''}>${o.l}</option>`).join('')}</select></div>`;
  const ta=(id,val)=>`<div class="fg"><label>${id}</label><textarea id="e-${id}">${val??''}</textarea></div>`;

  document.getElementById('modal-body').innerHTML=`
    <div class="sec-sep">📋 زانیاری بنەڕەتی</div>
    ${inp('title', ad.title)}
    ${inp('ad_number', ad.ad_number)}
    <div class="frow">
      ${sel('status', ad.status,[
        {v:'pending',l:'چاوەڕوان'},{v:'review',l:'پێداچوونەوە'},
        {v:'active',l:'چالاک'},{v:'completed',l:'تەواوبوو'},
        {v:'scheduled',l:'پلانگیراو'},{v:'rejected',l:'ڕەتکراوە'},{v:'paused',l:'وەستاو'}
      ])}
      ${sel('goal', ad.goal,[{v:'messages',l:'messages'},{v:'views',l:'views'}])}
    </div>
    <div class="frow">
      ${sel('gender', ad.gender,[{v:'male',l:'نێر'},{v:'female',l:'مێ'},{v:'all',l:'هەموو'}])}
      ${inp('location', ad.location)}
    </div>
    ${inp('target_ages', ad.target_ages)}
    ${inp('user_id', ad.user_id)}

    <div class="sec-sep">💰 بودجە و مەتریکەکان</div>
    <div class="frow-3">
      ${inp('budget', ad.budget,'number')}
      ${inp('target_budget', ad.target_budget,'number')}
      ${inp('daily_budget', ad.daily_budget,'number')}
    </div>
    <div class="frow-3">
      ${inp('total_budget', ad.total_budget,'number')}
      ${inp('current_spend', ad.current_spend,'number')}
      ${inp('spend', ad.spend,'number')}
    </div>
    <div class="frow-3">
      ${inp('impressions', ad.impressions,'number')}
      ${inp('clicks', ad.clicks,'number')}
      ${inp('conversions', ad.conversions,'number')}
    </div>
    <div class="frow-3">
      ${inp('conversion_rate', ad.conversion_rate,'number')}
      ${inp('cost_per_conversion', ad.cost_per_conversion,'number')}
      ${inp('cpm', ad.cpm,'number')}
    </div>

    <div class="sec-sep">📅 کات و بەروار</div>
    <div class="frow">
      ${inp('days', ad.days,'number')}
      ${inp('start_time', ad.start_time,'time')}
    </div>
    <div class="frow">
      ${inp('start_date', ad.start_date,'date')}
      ${inp('end_date', ad.end_date,'date')}
    </div>

    <div class="sec-sep">🎵 TikTok</div>
    <div class="frow">
      ${inp('tiktok_ad_id', ad.tiktok_ad_id)}
      ${inp('tiktok_campaign_id', ad.tiktok_campaign_id)}
    </div>
    ${inp('video_link', ad.video_link)}
    ${inp('tiktok_url', ad.tiktok_url)}
    ${ta('video_code', ad.video_code)}
    <div class="frow">
      ${inp('asset_id', ad.asset_id)}
      ${inp('card_id', ad.card_id)}
    </div>

    <div class="sec-sep">⚙️ تر</div>
    <div class="frow">
      ${sel('notified_admin', String(ad.notified_admin),[{v:'false',l:'نەخێر'},{v:'true',l:'بەڵێ'}])}
      ${inp('age_groups', ad.age_groups ? (typeof ad.age_groups==='string'?ad.age_groups:JSON.stringify(ad.age_groups)) : '')}
    </div>
    ${ta('reject_reason', ad.reject_reason!=='EMPTY'&&ad.reject_reason!=='NULL'?ad.reject_reason:'')}
  `;

  document.getElementById('modal').classList.add('open');
}

function closeModal(){document.getElementById('modal').classList.remove('open');editingId=null;}
function maybeClose(e){if(e.target===document.getElementById('modal'))closeModal();}

async function saveEdit(){
  if(!editingId)return;
  const btn=document.getElementById('save-btn');
  btn.disabled=true;btn.textContent='...';

  const g=(id)=>{const el=document.getElementById('e-'+id);return el?el.value:undefined;};
  const gn=(id)=>{const v=g(id);return v===''||v===undefined?null:parseFloat(v);};
  const gi=(id)=>{const v=g(id);return v===''||v===undefined?null:parseInt(v);};

  const payload={
    title:        g('title')||null,
    ad_number:    g('ad_number')||null,
    status:       g('status'),
    goal:         g('goal'),
    gender:       g('gender'),
    location:     g('location')||null,
    target_ages:  g('target_ages')||null,
    user_id:      g('user_id')||null,
    budget:       gn('budget'),
    target_budget:gn('target_budget'),
    daily_budget: gn('daily_budget'),
    total_budget: gn('total_budget'),
    current_spend:gn('current_spend'),
    spend:        gn('spend'),
    impressions:  gi('impressions'),
    clicks:       gi('clicks'),
    conversions:  gi('conversions'),
    conversion_rate:   gn('conversion_rate'),
    cost_per_conversion:gn('cost_per_conversion'),
    cpm:          gn('cpm'),
    days:         gi('days'),
    start_date:   g('start_date')||null,
    end_date:     g('end_date')||null,
    start_time:   g('start_time')||null,
    tiktok_ad_id: g('tiktok_ad_id')||null,
    tiktok_campaign_id:g('tiktok_campaign_id')||null,
    video_link:   g('video_link')||null,
    tiktok_url:   g('tiktok_url')||null,
    video_code:   g('video_code')||null,
    asset_id:     g('asset_id')||null,
    card_id:      g('card_id')||null,
    notified_admin: g('notified_admin')==='true',
    reject_reason: g('reject_reason')||null,
    age_groups:   g('age_groups')||null,
  };

  try{
    const res=await fetch(`${SUPABASE_URL}/rest/v1/pa_ads?id=eq.${editingId}`,{
      method:'PATCH',
      headers:{...H.headers,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify(payload)
    });
    if(!res.ok){const t=await res.text();throw new Error(t);}
    showToast('✓ پاشەکەوتکرا','ok');
    closeModal();
    await load(true);
  }catch(e){showToast('هەڵە: '+e.message,'err');}
  finally{btn.disabled=false;btn.textContent='💾 پاشەکەوتکردن';}
}

async function toggleStatus(id,cur){
  const next=cur==='active'?'paused':'active';
  try{
    const res=await fetch(`${SUPABASE_URL}/rest/v1/pa_ads?id=eq.${id}`,{
      method:'PATCH',
      headers:{...H.headers,'Content-Type':'application/json','Prefer':'return=minimal'},
      body:JSON.stringify({status:next})
    });
    if(!res.ok){const t=await res.text();throw new Error(t);}
    showToast(next==='active'?'✓ چالاک کرا':'⏸ وەستاندرا','ok');
    await load(true);
  }catch(e){showToast('هەڵە: '+e.message,'err');}
}

async function deleteAd(id){
  const ad=ADS.find(a=>a.id===id);
  if(!confirm('دڵنیایت لە سڕینەوەی "'+( ad?.title||'ڕیکلام #'+ad?.ad_number||id.slice(0,8))+'"؟'))return;
  try{
    const res=await fetch(`${SUPABASE_URL}/rest/v1/pa_ads?id=eq.${id}`,{method:'DELETE',headers:H.headers});
    if(!res.ok){const t=await res.text();throw new Error(t);}
    showToast('🗑 سڕایەوە','ok');
    await load(true);
  }catch(e){showToast('هەڵە: '+e.message,'err');}
}

let toastTimer;
function showToast(msg,type=''){
  const t=document.getElementById('toast');
  t.textContent=msg;t.className='toast show t-'+(type||'ok');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),3000);
}

load();startCD();
</script>
